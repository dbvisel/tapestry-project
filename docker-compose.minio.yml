services:
  client:
    build:
      dockerfile: ./Dockerfile.client-minio
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_AUTH_PROVIDER: ${AUTH_PROVIDER}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_BUG_REPORT_FORM_URL: ${BUG_REPORT_FORM_URL}
        VITE_AI_CHAT_EXPIRES_IN: ${AI_CHAT_EXPIRES_IN}
        VITE_WEBPAGE_LOADER_TIMEOUT: ${WEBPAGE_LOADER_TIMEOUT}
        VITE_STUN_SERVER: ${STUN_SERVER}
        VITE_SENTRY_DSN: ${SENTRY_DSN_CLIENT}
    ports:
      - 8080:80
    # networks:
    #   - traefik
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.${ENVIRONMENT_NAME}.rule=Host(`${HOST}.asteasolutions.net`)
    #   - traefik.http.services.${ENVIRONMENT_NAME}.loadbalancer.server.port=80
    #   - traefik.http.routers.${ENVIRONMENT_NAME}.entrypoints=https
    #   - traefik.http.routers.${ENVIRONMENT_NAME}.tls=true

  server:
    build:
      dockerfile: ./Dockerfile.server
      target: server
    environment: &server_env
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_USE_SSL: ${DB_USE_SSL}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}?schema=public
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SECRET_KEY: ${SECRET_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      EXTERNAL_SERVER_URL: ${EXTERNAL_SERVER_URL}
      VIEWER_URL: ${VIEWER_URL}
      JOBS_ADMIN_NAME: ${JOBS_ADMIN_NAME}
      JOBS_ADMIN_PASSWORD: ${JOBS_ADMIN_PASSWORD}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
      SENTRY_DSN: ${SENTRY_DSN_SERVER}
      IA_ACCOUNT_ID: ${IA_ACCOUNT_ID}
      IA_SECRET: ${IA_SECRET}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_INTERNAL_ENDPOINT_URL: ${AWS_INTERNAL_ENDPOINT_URL}
      TAPESTRY_THUMBNAIL_GENERATION_DELAY: 120_000
      TAPESTRY_THUMBNAIL_GENERATION_TIMEOUT: 600_000
      S3_CLEAN_UP_CRON_PATTERN: ${S3_CLEAN_UP_CRON_PATTERN}
    ports:
      - 3000:3000
    # networks:
    #   - traefik
    #   - database
    #   - redis
    #   - vault
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.${ENVIRONMENT_NAME}-api.rule=Host(`${HOST}-api.asteasolutions.net`)
    #   - traefik.http.services.${ENVIRONMENT_NAME}-api.loadbalancer.server.port=3000
    #   - traefik.http.routers.${ENVIRONMENT_NAME}-api.entrypoints=https
    #   - traefik.http.routers.${ENVIRONMENT_NAME}-api.tls=true

    depends_on:
      - db
      - redis
      - vault

  worker:
    build:
      dockerfile: ./Dockerfile.server
      target: worker
    init: true
    environment:
      <<: *server_env
      PUPPETEER_ARGS: "--no-sandbox,--disable-gpu,--disable-dev-shm-usage"
    depends_on:
      - db
      - redis
    # networks:
    #   - database
    #   - redis

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # networks:
    #   - database
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    image: redis:7
    volumes:
      - ./deployment/redis/redis.conf:/usr/local/etc/redis/redis.conf
    # networks:
    #   - redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  vault:
    image: hashicorp/vault:1.20
    container_name: vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      ROLE_ID: ${VAULT_ROLE_ID}
      SECRET_ID: ${VAULT_SECRET_ID}
    volumes:
      # Persistent storage: user API keys survive restarts. `down` keeps this
      # volume; `down -v` wipes it and the next start re-initialises from scratch.
      - vault-data:/vault/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # Real (non-dev) vault with file storage, so data persists. The entrypoint
        # auto-initialises on first run (1 unseal share, saved to the volume),
        # auto-unseals on every start, then idempotently seeds the approle from
        # VAULT_ROLE_ID/VAULT_SECRET_ID (placeholders are fine — they just need to
        # match what the server uses). Self-contained: no mounted script to miss.
        mkdir -p /vault/data/storage
        printf 'ui = true\ndisable_mlock = true\nstorage "file" { path = "/vault/data/storage" }\nlistener "tcp" { address = "0.0.0.0:8200" tls_disable = true }\n' > /tmp/vault.hcl
        vault server -config=/tmp/vault.hcl &
        VAULT_PID=$$!
        export VAULT_ADDR=http://127.0.0.1:8200
        echo "waiting for vault to respond..."
        until vault status >/dev/null 2>&1 || [ $$? -eq 2 ]; do sleep 1; done
        if [ ! -f /vault/data/init.txt ]; then
          echo "initialising vault (first run)..."
          vault operator init -key-shares=1 -key-threshold=1 > /vault/data/init.txt
        fi
        UNSEAL_KEY=$$(grep 'Unseal Key 1:' /vault/data/init.txt | awk '{print $$NF}')
        ROOT_TOKEN=$$(grep 'Initial Root Token:' /vault/data/init.txt | awk '{print $$NF}')
        if vault status -format=json | grep -qE '"sealed":[[:space:]]*true'; then
          echo "unsealing vault..."
          vault operator unseal "$$UNSEAL_KEY" >/dev/null
        fi
        export VAULT_TOKEN="$$ROOT_TOKEN"
        # Idempotent seeding: enable engines only if absent (avoids noisy
        # "already in use" errors on restart), and tolerate an already-registered
        # secret-id so a restart with persisted data doesn't abort under `set -e`.
        vault secrets list -format=json 2>/dev/null | grep -q '"secret/"' || vault secrets enable -path=secret kv-v2
        vault auth list -format=json 2>/dev/null | grep -q '"approle/"' || vault auth enable approle
        printf 'path "secret/data/users/*" { capabilities = ["create", "update", "read", "delete"] }\n' | vault policy write tapestries-policy -
        vault write auth/approle/role/tapestries token_policies=tapestries-policy token_ttl=1h token_max_ttl=4h role_id="$$ROLE_ID"
        vault write auth/approle/role/tapestries/custom-secret-id secret_id="$$SECRET_ID" >/dev/null 2>&1 || true
        echo "vault ready (persistent); approle 'tapestries' seeded"
        wait $$VAULT_PID
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

  mc: # MinIO Client - one-shot job that creates the bucket on startup
    image: minio/mc:latest
    # Only started when the 'minio' profile is enabled (setup.sh does this for the
    # bundled-MinIO backend). With your own AWS S3, this service is skipped.
    profiles: ["minio"]
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$AWS_ACCESS_KEY_ID\" \"$$AWS_SECRET_ACCESS_KEY\" >/dev/null 2>&1; do
        echo 'waiting for minio to be ready...'; sleep 1;
      done;
      mc mb --ignore-existing local/\"$$AWS_S3_BUCKET_NAME\";
      echo \"bucket '$$AWS_S3_BUCKET_NAME' is ready\";
      "
  
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["minio"]   # skipped when using your own AWS S3 (see setup.sh)
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MINIO_DEFAULT_BUCKETS: ${AWS_S3_BUCKET_NAME}
      CONSOLE_ACCESS_KEY: ${MINIO_CONSOLE_ACCESS_KEY}
      CONSOLE_SECRET_KEY: ${MINIO_CONSOLE_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      MINIO_API_CORS_ALLOW_CREDENTIALS_WITH_WILDCARD: "on"
    # networks:
    #   - minio
    command: server --address ":9000" --console-address ":9001" /data
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    # command: server /data

# networks:
#   database:
#   redis:
#   traefik:
#     external: true
#   vault:
#   minio:

volumes:
  pgdata:
  vault-data:
  minio-data:
